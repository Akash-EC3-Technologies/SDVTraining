controller:
  replicaCount: 1
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  ingressClass: nginx
  watchIngressWithoutClass: false
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443
  service:
    type: NodePort
  extraArgs:
    default-ssl-certificate: ingress-nginx/ota-lab-wildcard
  admissionWebhooks:
    enabled: true
  metrics:
    enabled: true
